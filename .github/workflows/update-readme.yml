name: Update README with HTML Links

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate README.md
        run: |
          cat << 'EOF' > README.md
          # 🧮 수학 인터랙티브 체험 실습실

          아래 링크를 클릭하면 새 탭에서 인터랙티브 페이지가 열립니다.

          EOF

          # .html 파일들을 찾아 정렬 후 마크다운 목록으로 추가
          find . -maxdepth 1 -name "*.html" ! -name "index.html" | sort | while read -r file; do
            filename=$(basename "$file")
            title="${filename%.html}"
            echo "- [${title}](https://eggplan-choi.github.io/math-lab/${filename})" >> README.md
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in README.md"
          else
            git commit -m "docs: auto-update README with latest HTML links [skip ci]"
            git push
          fi
